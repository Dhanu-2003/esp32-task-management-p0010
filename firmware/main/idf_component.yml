## IDF Component Manager Manifest File
dependencies:
  idf:
    version: ">=5.0.0"
  espressif/cjson: "^1.7.19"
  # Wi-Fi on chips that have no radio of their own (ESP32-P4): the radio lives in an
  # ESP32-C6 coprocessor and is reached over SDIO. esp_wifi_remote exposes the normal
  # esp_wifi API, so no application code changes are needed on these targets.
  # Not used on targets with a built-in Wi-Fi (plain esp32).
  espressif/esp_wifi_remote:
    version: ">=1.3.1,<2.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/esp_hosted:
    version: ">=2.11.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
